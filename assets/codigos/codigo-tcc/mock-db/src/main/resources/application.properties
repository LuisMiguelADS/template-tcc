# Porta interna do container 
server.port=8080
# Só avisos e erros no log: o mock atende milhares de consultas por segundo e não pode virar gargalo
logging.level.root=WARN

# Latência simulada de cada consulta
# Tempo que cada consulta leva para responder. Com 50 ms, uma requisição com queries=3 leva no mínimo ~150 ms em qualquer variante
tcc.mock-db.latency-ms=${MOCK_DB_LATENCY_MS:50}
# Se tiver a necessidade de testar variação na latência, o valor 0 é padrão
tcc.mock-db.jitter-ms=${MOCK_DB_JITTER_MS:0}

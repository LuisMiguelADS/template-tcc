# Porta interna do container 
server.port=8080
# Só avisos e erros no log: log em excesso sob carga alta consumiria CPU e distorceria a medição
logging.level.root=WARN

# Máximo de threads de plataforma atendendo requisições ao mesmo tempo
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
# Máximo de conexões abertas ao mesmo tempo
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:20000}
# Fila de conexões esperando ser aceitas quando o limite acima é atingido
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:8192}
# -1 = sem limite de requisições por conexão keep-alive
server.tomcat.max-keep-alive-requests=-1
# Tempo que uma conexão parada fica aberta esperando a próxima requisição do k6
server.tomcat.keep-alive-timeout=120s

# false = mvc 
spring.threads.virtual.enabled=${VIRTUAL_THREADS:false}

# Endereço do mock-db
tcc.mock-db.base-url=${DB_BASE_URL:http://localhost:18090}
# Tamanho máximo do pool de conexões com o mock-db
tcc.mock-db.max-connections=${DOWNSTREAM_MAX_CONNECTIONS:20000}
# Tempo máximo para conectar
tcc.mock-db.timeout-ms=${DOWNSTREAM_TIMEOUT_MS:30000}

# Rótulo da variante exibido em /health e gravado nos metadados da rodada
tcc.experiment.model=${MODEL:mvc}
